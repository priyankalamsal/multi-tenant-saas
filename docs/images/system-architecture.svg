  <text x="100" y="118" fill="#1A1717" font-family="Arial, sans-serif" font-size="34" font-weight="700">Multi-Tenant SaaS System Architecture</text>
  <text x="100" y="156" fill="#6F665D" font-family="Arial, sans-serif" font-size="20">Dockerized React + Express + PostgreSQL platform with JWT auth and tenant-isolated data access.</text>


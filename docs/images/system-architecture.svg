  <text x="132" y="336" fill="#1A1717" font-family="Arial, sans-serif" font-size="20">Protected routes</text>
  <text x="132" y="372" fill="#1A1717" font-family="Arial, sans-serif" font-size="20">Registration + login</text>
  <text x="132" y="408" fill="#1A1717" font-family="Arial, sans-serif" font-size="20">Projects, tasks, users UI</text>
  <text x="132" y="444" fill="#1A1717" font-family="Arial, sans-serif" font-size="20">Axios client with JWT header</text>
  <rect x="132" y="484" width="212" height="48" rx="16" fill="#FFFFFF"/>
  <text x="154" y="515" fill="#A6482B" font-family="Arial, sans-serif" font-size="18" font-weight="700">Port 3000 via Nginx</text>

